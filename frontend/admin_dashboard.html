<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nova Events 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .stat-card h3 {
            color: #6B7280;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .dashboard-section {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 2.5rem;
        }

        /* Grid for form inputs to save space */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Nova Admin</div>
        <nav>
            <ul id="nav-auth">
                <li><a href="home.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Admin Dashboard</h2>
            <button class="btn btn-secondary" style="width: auto; padding: 0.5rem 1rem; margin: 0;"
                onclick="loadDashboard()">Refresh Data</button>
        </div>

        <div id="admin-alert"></div>

        <!-- Analytics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Seats</h3>
                <div class="value" id="stat-total">--</div>
            </div>
            <div class="stat-card">
                <h3>Booked Seats</h3>
                <div class="value" id="stat-booked">--</div>
            </div>
            <div class="stat-card">
                <h3>Remaining Seats</h3>
                <div class="value" id="stat-remaining" style="color: var(--success-color);">--</div>
            </div>
        </div>

        <!-- Create Event Form -->
        <div class="dashboard-section">
            <h3 style="margin-bottom: 1.5rem; color: var(--primary-color);">Create New Event</h3>
            <form id="create-event-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="event-title">Event Title</label>
                        <input type="text" id="event-title" required placeholder="Cloud Architecture 101">
                    </div>
                    <div class="form-group">
                        <label for="event-date">Date (YYYY-MM-DD)</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="form-group">
                        <label for="event-location">Location</label>
                        <input type="text" id="event-location" required placeholder="Main Hall A">
                    </div>
                    <div class="form-group">
                        <label for="event-seats">Total Seats</label>
                        <input type="number" id="event-seats" required placeholder="500" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="event-desc">Description</label>
                    <input type="text" id="event-desc" required placeholder="Short description of the event...">
                </div>
                <button type="submit" class="btn" style="width: auto;">Create Event</button>
            </form>
        </div>

        <!-- Bookings Table -->
        <h3 style="margin-bottom: 1rem; color: var(--primary-color);">
            All Events
        </h3>

        <div id="admin-events-list"></div>
        <div class="table-container" style="margin-top: 0;">
            <table>
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Event Title</th>
                        <th>Booking Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bookings-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center;">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>Nova Events 2026 &copy; Cloud & Technology Summit</p>
    </footer>

    <script src="js/main.js?v=3"></script>
    <script>
        // Ensure user is an admin
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth('admin');
            loadDashboard();
        });

        // Event listener for create event
        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                title: document.getElementById('event-title').value,
                date: document.getElementById('event-date').value,
                location: document.getElementById('event-location').value,
                total_seats: document.getElementById('event-seats').value,
                description: document.getElementById('event-desc').value
            };

            const result = await fetchAPI('/admin/create-event', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (result.success) {
                showAlert('admin-alert', 'Event created successfully!', 'success');
                document.getElementById('create-event-form').reset();
                loadDashboard(); // Refresh stats immediately
            } else {
                showAlert('admin-alert', result.error || 'Failed to create event', 'error');
            }
        });

        async function loadDashboard() {
            loadStats();
            loadBookings();
            loadEvents();
        }

        async function loadStats() {
            const result = await fetchAPI('/admin/event-stats');
            if (result.success && result.data) {
                document.getElementById('stat-total').textContent = result.data.total_seats;
                document.getElementById('stat-booked').textContent = result.data.booked_seats;
                document.getElementById('stat-remaining').textContent = result.data.remaining_seats;
            }
        }

        async function loadBookings() {
            const tbody = document.getElementById('bookings-table-body');
            const result = await fetchAPI('/admin/bookings');

            if (result.success) {
                tbody.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No bookings found.</td></tr>';
                    return;
                }

                result.data.forEach(b => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${b.ticket_id || b.id || 'N/A'}</strong></td>
                        <td>${b.name || b.user_name || 'N/A'}</td>
                        <td>${b.email || b.user_email || 'N/A'}</td>
                        <td>${b.event_title || b.title || 'N/A'}</td>
                        <td>${formatDate(b.booking_date || b.created_at)}</td>
                        <td><span class="status-badge" style="background-color: ${b.status === 'Cancelled' ? '#FEE2E2' : '#DCFCE7'}; color: ${b.status === 'Cancelled' ? '#991B1B' : '#166534'};">${b.status || 'Confirmed'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                showAlert('admin-alert', result.error, 'error');
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--error-color);">Failed to load bookings.</td></tr>';
            }
        }

        async function loadEvents() {

            const container = document.getElementById('admin-events-list');

            const result = await fetchAPI('/events');

            if (result.success) {

                container.innerHTML = '';

                result.data.forEach(event => {

                    container.innerHTML += `
                <div class="card" style="margin-bottom: 1rem;">
                    <h3>${event.title}</h3>

                    <p>${event.description}</p>

                    <p><strong>Date:</strong> 
                    ${formatDate(event.event_date || event.date)}
                    </p>

                    <p><strong>Location:</strong> 
                    ${event.location}
                    </p>

                    <p><strong>Seats:</strong> 
                    ${event.available_seats}/${event.total_seats}
                    </p>
                </div>
            `;
                });

            } else {

                container.innerHTML = '<p>Failed to load events</p>';
            }
        }
    </script>
</body>

</html>
